[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathvqa"
version = "0.1.0"
description = "Neuro-Symbolic PathVQA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12.1",
    "torchvision>=0.20.0",
    "transformers>=5.12.1",
    "peft>=0.20.0",
    "datasets>=2.0.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.66",
    "tensorboard>=2.15",
    "fastapi>=0.139.0",
    "uvicorn>=0.49.0",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15",
    "mypy>=1.0",
    "httpx>=0.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --cov=src/pathvqa --cov-report=xml --cov-fail-under=80"
filterwarnings = ["ignore:Truncated File Read"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["data", "checkpoints", "logs", "outputs"]

[tool.ruff.lint.per-file-ignores]
# F821: forward-reference string annotations not resolved by ruff
"src/pathvqa/data/pathvqa_dataset.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
strict = true

[[tool.mypy.overrides]]
module = ["torchvision.*", "datasets.*", "scipy.*"]
ignore_missing_imports = true
